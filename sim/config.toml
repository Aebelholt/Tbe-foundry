# ------------------------------------------------ 4e native comparison
# Native 4e resolution is not implemented yet: the 4e combat rules are not in
# the repo. Fill these and supply the rules text, then native.py gets written.
[native_4e]
enabled = false
defender_hit_capacity = "?"
